<!--HEAD--><!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070708">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pulso">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<!--/HEAD-->
<title>Pulso</title>
<style>
:root{
  color-scheme:dark;
  --bg:#070708; --s1:#111114; --s2:#1a1a1e; --s3:#232328; --line:#2a2a30;
  --tx:#f4f4f6; --mu:#8e8e98; --mu2:#5f5f68;
  --red:#e3192b; --red2:#ff4252; --redbg:rgba(227,25,43,.14); --redline:rgba(227,25,43,.45);
  --ok:#35c97f; --okbg:rgba(53,201,127,.13); --warn:#f5a524; --warnbg:rgba(245,165,36,.13);
  --r:18px; --tabh:64px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--tx)}
body{margin:0;font:15px/1.4 var(--font);min-height:100%;overscroll-behavior-y:none;-webkit-font-smoothing:antialiased}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--red2);outline-offset:2px;border-radius:8px}

/* header */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;background:rgba(7,7,8,.82);
  -webkit-backdrop-filter:saturate(160%) blur(18px);backdrop-filter:saturate(160%) blur(18px);border-bottom:1px solid transparent}
.top.scrolled{border-bottom-color:var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;letter-spacing:-.01em}
.brand svg{color:var(--red);width:24px;height:24px}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--tx);background:var(--s1)}
.icon-btn:active{background:var(--s3)}
main{padding:6px 16px calc(var(--tabh) + 96px + env(safe-area-inset-bottom,0px));max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);
  padding:6px 8px calc(env(safe-area-inset-bottom,0px) + 4px);background:rgba(10,10,12,.88);
  -webkit-backdrop-filter:saturate(160%) blur(20px);backdrop-filter:saturate(160%) blur(20px);border-top:1px solid var(--line)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--mu2);font-size:10.5px;font-weight:600;letter-spacing:.01em;position:relative}
.tab.on{color:var(--tx)}
.tab.on svg{color:var(--red)}
.tab .dot{position:absolute;top:3px;left:calc(50% + 8px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--red);color:#fff;font-size:10px;line-height:16px;font-weight:700}
.fab{position:fixed;z-index:31;right:18px;bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 16px);width:58px;height:58px;border-radius:20px;
  background:var(--red);color:#fff;display:grid;place-items:center;box-shadow:0 10px 30px rgba(227,25,43,.45),0 0 0 1px rgba(255,255,255,.08) inset}
.fab svg{width:28px;height:28px;stroke-width:2.4}
.fab:active{transform:scale(.94)}

/* type */
.hero{padding-top:6px}
.hero .k{color:var(--red2);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.hero h1{margin:2px 0 0;font-size:40px;line-height:1.02;font-weight:800;letter-spacing:-.035em;text-wrap:balance}
.hero p{margin:4px 0 0;color:var(--mu);font-size:16px}
h2.sec{display:flex;align-items:center;justify-content:space-between;margin:0 0 8px;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}
h2.sec button{font-size:13px;letter-spacing:0;text-transform:none;color:var(--red2);font-weight:600}
.muted{color:var(--mu)}
.small{font-size:13px}

/* surfaces */
.card{background:var(--s1);border-radius:var(--r);padding:14px}
.list{background:var(--s1);border-radius:var(--r);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:13px 14px;width:100%;text-align:left;position:relative}
.item + .item{border-top:1px solid var(--line)}
button.item:active,.item.tap:active{background:var(--s2)}
.item .main{flex:1;min-width:0}
.item .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{color:var(--mu);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .v{font-weight:700;text-align:right;white-space:nowrap}
.time{width:48px;flex:none;font-weight:700;font-size:14px}
.time small{display:block;color:var(--mu);font-weight:500;font-size:11px}
.bar{width:4px;align-self:stretch;border-radius:2px;background:var(--red);flex:none}
.bar.warn{background:var(--warn)} .bar.ok{background:var(--ok)} .bar.mu{background:var(--mu2)}
.empty{padding:22px 14px;text-align:center;color:var(--mu);font-size:14px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
.pill.red{background:var(--redbg);color:var(--red2)} .pill.ok{background:var(--okbg);color:var(--ok)}
.pill.warn{background:var(--warnbg);color:var(--warn)} .pill.mu{background:var(--s3);color:var(--mu)}
.doc{font-size:10.5px;font-weight:800;letter-spacing:.06em;padding:2px 6px;border-radius:6px;border:1px solid var(--line);color:var(--mu)}
.doc.cnpj{border-color:var(--redline);color:var(--red2)}
.in{color:var(--ok)} .out{color:var(--tx)} .neg{color:var(--red2)}

.banner{display:flex;gap:12px;align-items:center;padding:13px 14px;border-radius:var(--r);background:var(--s1);border:1px solid var(--line);width:100%;text-align:left}
.banner.alert{background:linear-gradient(135deg,rgba(227,25,43,.22),rgba(227,25,43,.08));border-color:var(--redline)}
.banner .ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--redbg);color:var(--red2);flex:none}
.banner b{display:block}
.banner span{color:var(--mu);font-size:13px}
.banner .x{margin-left:auto;color:var(--red2);font-weight:700;font-size:13px;white-space:nowrap}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--s1);border-radius:16px;padding:12px}
.stat .l{font-size:11.5px;color:var(--mu);font-weight:600}
.stat .n{font-size:17px;font-weight:800;letter-spacing:-.02em;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.big{font-size:34px;font-weight:800;letter-spacing:-.035em;line-height:1.05}

/* quick add */
.qa{display:flex;align-items:center;gap:8px;background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:6px 6px 6px 14px}
.qa:focus-within{border-color:var(--redline)}
.qa input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:16px;padding:8px 0}
.qa button{height:38px;padding:0 14px;border-radius:12px;background:var(--red);color:#fff;font-weight:700;font-size:14px}

/* chips & seg */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 13px;border-radius:999px;background:var(--s1);color:var(--mu);font-weight:600;font-size:13.5px;border:1px solid var(--line);white-space:nowrap}
.chip.on{background:var(--tx);color:#000;border-color:var(--tx)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--s2);border-radius:12px;padding:3px;gap:3px}
.seg label{position:relative;text-align:center}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;padding:9px 6px;border-radius:9px;font-weight:600;font-size:14px;color:var(--mu)}
.seg input:checked + span{background:var(--s3);color:var(--tx);box-shadow:0 1px 0 rgba(255,255,255,.06) inset}
.seg input:focus-visible + span{outline:2px solid var(--red2)}
.seg.red input:checked + span{background:var(--red);color:#fff}

/* month nav */
.mnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mnav h3{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em;text-transform:capitalize}
.mnav .navb{display:flex;gap:6px}

/* calendar */
.cal{background:var(--s1);border-radius:var(--r);padding:10px 8px}
.cal .wd,.cal .grid{display:grid;grid-template-columns:repeat(7,1fr)}
.cal .wd span{text-align:center;font-size:11px;font-weight:700;color:var(--mu2);padding-bottom:6px;text-transform:uppercase}
.cal .d{aspect-ratio:1/1.05;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:12px;font-weight:600;font-size:15px;position:relative}
.cal .d.out{color:var(--mu2)}
.cal .d.today{color:var(--red2);font-weight:800}
.cal .d.sel{background:var(--red);color:#fff}
.cal .d:active{background:var(--s3)}
.cal .dots{display:flex;gap:3px;height:5px}
.cal .dots i{width:5px;height:5px;border-radius:50%;background:var(--red2)}
.cal .dots i.w{background:var(--warn)} .cal .dots i.k{background:var(--ok)}
.cal .d.sel .dots i{background:#fff}

/* charts */
.cols{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:end;height:120px;padding-top:6px}
.col{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.col .pair{display:flex;gap:3px;align-items:flex-end;height:100%;width:100%;justify-content:center}
.col .pair i{width:38%;max-width:14px;border-radius:4px 4px 2px 2px;background:var(--ok);min-height:2px}
.col .pair i.o{background:var(--red)}
.col.cur .pair i{box-shadow:0 0 0 1px rgba(255,255,255,.25)}
.col span{font-size:11px;color:var(--mu);font-weight:600;text-transform:capitalize}
.col.cur span{color:var(--tx)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mu);margin-top:10px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;background:var(--ok)}
.legend i.o{background:var(--red)}
.cats{display:flex;flex-direction:column;gap:11px}
.catrow .h{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px}
.catrow .h b{font-weight:600}
.track{height:8px;border-radius:4px;background:var(--s3);overflow:hidden}
.track i{display:block;height:100%;border-radius:4px;background:var(--red)}
.prog{height:6px;border-radius:3px;background:var(--s3);overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--red);border-radius:3px}
.prog.ok i{background:var(--ok)}

.debt{display:block;width:100%;text-align:left;padding:14px}
.debt + .debt{border-top:1px solid var(--line)}
.debt:active{background:var(--s2)}
.debt .r1{display:flex;align-items:center;gap:8px}
.debt .r1 .t{font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.debt .r2{display:flex;justify-content:space-between;gap:8px;margin-top:6px;font-size:13px;color:var(--mu)}
.debt .r2 b{color:var(--tx);font-weight:700}
.debt .r2 > span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.debt .r2 > span:last-child{white-space:nowrap}

.grp{font-size:12px;font-weight:700;color:var(--mu);letter-spacing:.06em;text-transform:uppercase;padding:14px 2px 6px}

/* sheet */
#layer{position:fixed;inset:0;z-index:50;display:none}
#layer.on{display:block}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.6);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);animation:fade .2s ease}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92dvh;overflow-y:auto;overscroll-behavior:contain;background:var(--s1);border-radius:24px 24px 0 0;
  padding:8px 16px calc(env(safe-area-inset-bottom,0px) + 20px);animation:up .28s cubic-bezier(.2,.9,.3,1);max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.grab{width:38px;height:5px;border-radius:3px;background:var(--s3);margin:0 auto 2px;flex:none}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sheet-h h2{margin:0;font-size:21px;font-weight:800;letter-spacing:-.02em}
.sheet .icon-btn{background:var(--s2);font-size:22px}
.f{display:flex;flex-direction:column;gap:6px}
.f > span{font-size:12.5px;font-weight:700;color:var(--mu);letter-spacing:.03em}
.f input,.f select,.f textarea{width:100%;background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:16px;outline:0;min-height:46px;-webkit-appearance:none;appearance:none}
.f select{background-image:linear-gradient(45deg,transparent 50%,var(--mu) 50%),linear-gradient(135deg,var(--mu) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--redline)}
.f textarea{min-height:76px;resize:vertical}
.f .err{color:var(--red2);font-size:12.5px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.money-in{font-size:30px!important;font-weight:800;letter-spacing:-.02em;text-align:center}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{position:relative}
.checks input{position:absolute;opacity:0;pointer-events:none}
.checks span{display:block;padding:8px 12px;border-radius:999px;background:var(--s2);border:1px solid var(--line);font-size:13.5px;font-weight:600;color:var(--mu)}
.checks input:checked + span{background:var(--redbg);border-color:var(--redline);color:var(--red2)}
.checks input:focus-visible + span{outline:2px solid var(--red2)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;border-radius:14px;background:var(--s2);font-weight:700;font-size:16px;padding:0 16px;width:100%}
.btn.primary{background:var(--red);color:#fff}
.btn.ghost{background:none;color:var(--red2)}
.btn.danger{background:var(--redbg);color:var(--red2)}
.btn:active{opacity:.85}
.btns{display:flex;flex-direction:column;gap:8px}
.inst{display:flex;flex-direction:column}
.inst .item{padding:11px 4px}
.tick{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.tick.on{background:var(--ok);border-color:var(--ok);color:#000}
.tick.late{border-color:var(--red)}
.tick svg{width:16px;height:16px;stroke-width:3}

/* modal & popup */
.modal{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:24px}
.modal .back{position:absolute;inset:0;background:rgba(0,0,0,.65);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:fade .2s}
.modal .box{position:relative;width:100%;max-width:360px;background:var(--s1);border-radius:22px;padding:22px 18px 16px;text-align:center;animation:pop .28s cubic-bezier(.2,1.2,.4,1)}
.modal .box h3{margin:6px 0 4px;font-size:20px;letter-spacing:-.02em}
.modal .box p{margin:0 0 16px;color:var(--mu)}
.modal .box .pk{color:var(--red2);font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.modal .box.rem{border:1px solid var(--redline);box-shadow:0 0 0 6px rgba(227,25,43,.08),0 20px 60px rgba(227,25,43,.25)}
.modal .ring{width:58px;height:58px;margin:0 auto;border-radius:50%;display:grid;place-items:center;background:var(--redbg);color:var(--red2)}
.modal .ring svg{width:28px;height:28px;animation:ring 1.2s ease-in-out 2}
.modal .b2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* lock */
#lock{position:fixed;inset:0;z-index:90;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:calc(env(safe-area-inset-top,0px) + 20px) 24px calc(env(safe-area-inset-bottom,0px) + 20px)}
#lock .logo{color:var(--red);width:44px;height:44px}
#lock h2{margin:0;font-size:20px}
.pdots{display:flex;gap:14px}
.pdots i{width:13px;height:13px;border-radius:50%;border:2px solid var(--mu2)}
.pdots i.on{background:var(--red);border-color:var(--red)}
.pdots.shake{animation:shake .35s}
.keys{display:grid;grid-template-columns:repeat(3,76px);gap:14px}
.keys button{width:76px;height:76px;border-radius:50%;background:var(--s1);font-size:28px;font-weight:500;display:grid;place-items:center}
.keys button:active{background:var(--s3)}
.keys button.ghost{background:none;color:var(--mu)}

#toast{position:fixed;left:50%;bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 90px);transform:translateX(-50%) translateY(20px);z-index:95;
  background:var(--tx);color:#000;padding:11px 16px;border-radius:14px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.25s;max-width:calc(100% - 32px);text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

.set .item .s{white-space:normal}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;color:var(--mu)}
.steps b{color:var(--tx)}

@keyframes up{from{transform:translateY(100%)}}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:scale(.9);opacity:0}}
@keyframes ring{0%,100%{transform:rotate(0)}20%{transform:rotate(14deg)}40%{transform:rotate(-12deg)}60%{transform:rotate(8deg)}80%{transform:rotate(-4deg)}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (min-width:600px){.hero h1{font-size:48px}}
</style>
<!--HEAD-->
</head>
<body>
<!--/HEAD-->
<header class="top" id="top">
  <div class="brand"><svg class="i" viewBox="0 0 24 24"><path d="M2 12h4l2.5-6 4 12 3-9 1.5 3H22"/></svg><span id="topTitle">Pulso</span></div>
  <div style="display:flex;gap:8px">
    <button class="icon-btn" data-act="toggleHide" id="eyeBtn" aria-label="Ocultar valores"></button>
  </div>
</header>
<main id="view"></main>
<button class="fab" data-act="addMenu" aria-label="Adicionar"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
<nav class="tabs" id="tabs"></nav>
<div id="layer"></div>
<div id="modal"></div>
<div id="popup"></div>
<div id="lock" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
'use strict';
/* ---------- utils ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ymd(d)};
const addMonths=(s,n)=>{const[y,m,d]=s.split('-').map(Number);const t=new Date(y,m-1+n,1);const last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();t.setDate(Math.min(d,last));return ymd(t)};
const today=()=>ymd(new Date());
const ym=s=>s.slice(0,7);
const addYM=(s,n)=>addMonths(s+'-01',n).slice(0,7);
const MES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const DIA=['dom','seg','ter','qua','qui','sex','sáb'];
const DIAF=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const fmtDay=s=>{const d=pd(s);return `${DIA[d.getDay()]}, ${d.getDate()} ${MES[d.getMonth()].slice(0,3)}`};

/* ---------- CPF / CNPJ ---------- */
const onlyD=s=>String(s||'').replace(/\D/g,'');
function validCPF(c){c=onlyD(c);if(c.length!==11||/^(\d)\1+$/.test(c))return false;for(let t=9;t<11;t++){let s=0;for(let i=0;i<t;i++)s+=+c[i]*(t+1-i);if(((s*10)%11)%10!==+c[t])return false}return true}
function validCNPJ(c){c=onlyD(c);if(c.length!==14||/^(\d)\1+$/.test(c))return false;const calc=n=>{let s=0,p=n-7;for(let i=0;i<n;i++){s+=+c[i]*p--;if(p<2)p=9}const r=s%11;return r<2?0:11-r};return calc(12)===+c[12]&&calc(13)===+c[13]}
function maskDoc(v,type){const d=onlyD(v).slice(0,type==='CNPJ'?14:11);if(type==='CNPJ')return d.replace(/^(\d{2})(\d)/,'$1.$2').replace(/^(\d{2})\.(\d{3})(\d)/,'$1.$2.$3').replace(/\.(\d{3})(\d)/,'.$1/$2').replace(/(\d{4})(\d)/,'$1-$2');return d.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2')}
const hideDoc=(doc,type)=>{if(!doc)return '';if(S.settings.hide)return type==='CNPJ'?'••.•••.•••/••••-••':'•••.•••.•••-••';return doc};

/* ---------- domain ---------- */
function occursOn(ev,d){if(d<ev.date)return false;if(ev.until&&d>ev.until)return false;switch(ev.repeat){case 'daily':return true;case 'weekly':return pd(d).getDay()===pd(ev.date).getDay();case 'monthly':return d.slice(8)===ev.date.slice(8);case 'yearly':return d.slice(5)===ev.date.slice(5);default:return d===ev.date}}
const eventsOn=d=>S.events.filter(e=>occursOn(e,d)).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
function debtInfo(d){
  const t=today(),hz=addDays(t,62),n=+d.n||0,paid=new Set(d.paid||[]),list=[];
  for(let i=0;i<(n||600);i++){const due=addMonths(d.first,i);if(!n&&due>hz)break;list.push({i:i+1,due,paid:paid.has(due)})}
  let overdue=[],next=null,paidCount=0;
  for(const x of list){if(x.paid)paidCount++;else if(x.due<t)overdue.push(x);else if(!next)next=x}
  const remaining=n?(n-paidCount)*d.value:overdue.length*d.value;
  const done=n>0&&paidCount>=n;
  let status='ok',label='Em dia';
  if(done){status='ok';label='Quitada'}else if(overdue.length){status='red';label=overdue.length>1?`${overdue.length} atrasadas`:'Atrasada'}
  else if(next&&next.due<=addDays(t,3)){status='warn';label=next.due===t?'Vence hoje':'Vence em breve'}
  return {list,overdue,next,paidCount,remaining,n,done,status,label};
}
function duesOn(day){const r=[];for(const d of S.debts){for(const x of debtInfo(d).list)if(x.due===day)r.push({d,x})}return r}
function monthTx(m,p='all'){return S.tx.filter(x=>ym(x.date)===m&&(p==='all'||x.profileId===p))}
function sums(list){let i=0,o=0;for(const x of list)x.type==='in'?i+=x.amount:o+=x.amount;return {i,o,b:i-o}}
function profileTotals(){return S.profiles.map(p=>{let rem=0,month=0,late=0;for(const d of S.debts.filter(d=>d.profileId===p.id)){const f=debtInfo(d);if(f.done)continue;rem+=f.remaining;month+=d.value;late+=f.overdue.length}return {p,rem,month,late}})}

/* ---------- reminders ---------- */
function collectReminders(from,to){
  const res=[],t0=ymd(new Date(from-3*864e5)),t1=ymd(new Date(to+8*864e5));
  const at=(day,time)=>{const b=pd(day);const[h,m]=(time||'09:00').split(':');b.setHours(+h,+m,0,0);return b.getTime()};
  for(const ev of S.events){for(let d=t0;d<=t1;d=addDays(d,1)){if(!occursOn(ev,d))continue;const base=at(d,ev.time||S.settings.allDayTime);
    for(const m of ev.remind||[]){const a=base-m*60000;if(a>from&&a<=to)res.push({key:`e|${ev.id}|${d}|${m}`,at:a,alert:ev.alert||S.settings.alert,title:ev.title,body:`${m?'Em '+fmtMin(m)+' · ':''}${relDay(d)}${ev.time?' às '+ev.time:''}${ev.location?' · '+ev.location:''}`,go:'agenda',day:d})}}}
  for(const d of S.debts){const f=debtInfo(d);for(const x of f.list){if(x.paid||x.due<t0||x.due>t1)continue;const base=at(x.due,S.settings.billTime);
    for(const m of d.remind||[]){const a=base-m*60000;if(a>from&&a<=to)res.push({key:`d|${d.id}|${x.due}|${m}`,at:a,alert:d.alert||S.settings.alert,title:`${d.name}${f.n?` · parcela ${x.i}/${f.n}`:''}`,body:`${money(d.value)} vence ${relDay(x.due)}`,go:'debts',debt:d.id})}}}
  for(const s of S.snoozes)if(s.at>from&&s.at<=to)res.push(s);
  return res.sort((a,b)=>a.at-b.at);
}
const canNotify=()=>'Notification' in window&&Notification.permission==='granted';
async function notify(title,body,tag){try{if(!canNotify())return false;const reg=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration();if(reg){await reg.showNotification(title,{body,tag,icon:'icon-192.png',badge:'icon-192.png'});return true}new Notification(title,{body,tag});return true}catch(e){return false}}
const popQ=[];
function check(){
  const now=Date.now(),from=Math.max(S.lastCheck||now,now-12*3600e3);
  const items=collectReminders(from,now).filter(x=>!S.fired[x.key]);
  S.lastCheck=now;
  for(const x of items)S.fired[x.key]=x.at;
  S.snoozes=S.snoozes.filter(s=>s.at>now);
  for(const k in S.fired)if(S.fired[k]<now-4*864e5)delete S.fired[k];
  save();
  if(!items.length)return;
  for(const x of items){
    const late=now-x.at>5*60000;
    const wantN=x.alert!=='popup',wantP=x.alert!=='notif'||!canNotify();
    if(wantN)notify(x.title,(late?'(enquanto o app estava fechado) ':'')+x.body,x.key);
    if(wantP)popQ.push({...x,late});
  }
  showPopup();
}
function showPopup(){
  const P=$('#popup');if(P.innerHTML||!popQ.length||document.hidden)return;
  const x=popQ[0];
  P.innerHTML=`<div class="modal" role="alertdialog" aria-labelledby="popT"><div class="back"></div><div class="box rem">
    <div class="ring">${I('bell')}</div><div class="pk" style="margin-top:12px">${x.late?'Lembrete perdido':'Lembrete'}${popQ.length>1?` · 1 de ${popQ.length}`:''}</div>
    <h3 id="popT">${esc(x.title)}</h3><p>${esc(x.body)}</p>
    <div class="b2"><button class="btn" data-act="snooze">Adiar 10 min</button><button class="btn primary" data-act="popOk">Ok</button></div>
    ${x.go?`<button class="btn ghost" data-act="popGo" style="margin-top:6px">Abrir</button>`:''}</div></div>`;
}
function updateBadge(){try{if(!('setAppBadge' in navigator))return;const t=today();let n=eventsOn(t).length;for(const d of S.debts){const f=debtInfo(d);n+=f.overdue.length+(f.next&&f.next.due===t?1:0)}n?navigator.setAppBadge(n):navigator.clearAppBadge()}catch(e){}}

function evItem(e,d){return `<button class="item" data-act="editEvent" data-id="${e.id}"><div class="time num">${e.time||'Dia'}<small>${e.time?'':'todo'}</small></div><div class="bar"></div>
  <div class="main"><div class="t">${esc(e.title)}</div><div class="s">${[e.location,e.repeat!=='none'?({daily:'Todo dia',weekly:'Toda semana',monthly:'Todo mês',yearly:'Todo ano'})[e.repeat]:'',d&&d!==today()?relDay(d):''].filter(Boolean).map(esc).join(' · ')||'Compromisso'}</div></div></button>`}
function dueItem(d,x,showDay){const f=debtInfo(d);const late=!x.paid&&x.due<today();return `<button class="item" data-act="openDebt" data-id="${d.id}"><div class="bar ${x.paid?'ok':late?'':'warn'}"></div>
  <div class="main"><div class="t">${esc(d.name)} ${docTag(d.profileId)}</div><div class="s">${f.n?`Parcela ${x.i}/${f.n} · `:''}${x.paid?'Paga':late?'Venceu '+relDay(x.due):'Vence '+(showDay?relDay(x.due):'neste dia')}</div></div>
  <div class="v num ${late?'neg':''}">${money(d.value)}</div></button>`}

function vHome(){
  const t=today(),d=new Date(),h=d.getHours();
  const greet=h<5?'Boa noite':h<12?'Bom dia':h<18?'Boa tarde':'Boa noite';
  const evs=eventsOn(t);
  const late=[],soon=[];
  for(const db of S.debts){const f=debtInfo(db);for(const x of f.overdue)late.push({d:db,x});for(const x of f.list)if(!x.paid&&x.due>=t&&x.due<=addDays(t,7))soon.push({d:db,x})}
  soon.sort((a,b)=>a.x.due.localeCompare(b.x.due));
  const lateSum=late.reduce((s,a)=>s+a.d.value,0);
  const m=sums(monthTx(ym(t)));
  const hasEx=S.events.some(e=>e.ex)||S.tx.some(e=>e.ex)||S.debts.some(e=>e.ex);
  const tomorrow=eventsOn(addDays(t,1));
  let html=`<section class="hero"><div class="k">${greet}</div><h1>${DIAF[d.getDay()]}, ${d.getDate()} de ${MES[d.getMonth()]}</h1>
    <p>${evs.length?`${evs.length} compromisso${evs.length>1?'s':''} hoje`:'Nenhum compromisso hoje'}${soon.length?` · ${soon.length} vencimento${soon.length>1?'s':''} na semana`:''}</p></section>`;
  html+=`<form class="qa" id="qa"><input id="qaIn" enterkeyhint="go" placeholder='"dentista amanhã 15h" ou "gastei 45 almoço"' aria-label="Adicionar rápido"><button type="submit">Criar</button></form>`;
  if(hasEx)html+=`<div class="banner"><div class="ic">${I('spark')}</div><div><b>Você está vendo exemplos</b><span>Toque para apagar e começar com seus dados.</span></div><button class="x" data-act="clearEx">Apagar</button></div>`;
  if(isIOS&&!standalone()&&!inFrame)html+=`<button class="banner" data-act="installHelp"><div class="ic">${I('phone')}</div><div><b>Instale na Tela de Início</b><span>Libera notificações, Face ID e modo tela cheia.</span></div><span class="x">Como?</span></button>`;
  else if('Notification' in window&&Notification.permission==='default')html+=`<button class="banner" data-act="enableNotif"><div class="ic">${I('bell')}</div><div><b>Ativar notificações</b><span>Para receber os lembretes de compromissos e contas.</span></div><span class="x">Ativar</span></button>`;
  if(late.length)html+=`<button class="banner alert" data-act="tab" data-tab="debts"><div class="ic">${I('alert')}</div><div><b>${late.length} conta${late.length>1?'s':''} em atraso</b><span class="num">${money(lateSum)} vencido</span></div><span class="x">Ver</span></button>`;
  html+=`<section><h2 class="sec">Hoje <button data-act="tab" data-tab="agenda">Agenda</button></h2><div class="list">${evs.map(e=>evItem(e)).join('')||'<div class="empty">Dia livre. Toque em + para agendar.</div>'}</div>
    ${tomorrow.length?`<p class="small muted" style="margin:8px 2px 0">Amanhã: ${tomorrow.map(e=>esc((e.time?e.time+' ':'')+e.title)).join(' · ')}</p>`:''}</section>`;
  html+=`<section><h2 class="sec">Vencimentos · 7 dias <button data-act="tab" data-tab="debts">Dívidas</button></h2><div class="list">${soon.map(a=>dueItem(a.d,a.x,true)).join('')||'<div class="empty">Nada vence nos próximos 7 dias.</div>'}</div></section>`;
  html+=`<section><h2 class="sec">${MES[d.getMonth()]} <button data-act="tab" data-tab="fin">Finanças</button></h2><div class="stats num">
    <div class="stat"><div class="l">Entradas</div><div class="n in">${money(m.i)}</div></div><div class="stat"><div class="l">Saídas</div><div class="n">${money(m.o)}</div></div>
    <div class="stat"><div class="l">Saldo</div><div class="n ${m.b<0?'neg':''}">${money(m.b)}</div></div></div></section>`;
  const pt=profileTotals().filter(x=>x.rem||x.month);
  if(pt.length)html+=`<section><h2 class="sec">Dívidas por documento</h2><div class="list">${pt.map(x=>`<button class="item" data-act="debtsOf" data-id="${x.p.id}">${I(x.p.type==='CNPJ'?'bld':'user')}
    <div class="main"><div class="t">${esc(x.p.name)} ${docTag(x.p.id)}</div><div class="s num">${money(x.month)}/mês${x.late?` · <span class="neg">${x.late} atrasada${x.late>1?'s':''}</span>`:''}</div></div><div class="v num">${money(x.rem)}</div></button>`).join('')}</div></section>`;
  return html;
}

function vAgenda(){
  const t=today(),[y,mo]=ui.calMonth.split('-').map(Number);
  const first=new Date(y,mo-1,1),start=addDays(ymd(first),-first.getDay());
  let cells='';
  for(let i=0;i<42;i++){const d=addDays(start,i);const ev=eventsOn(d).length,du=duesOn(d);const unpaid=du.filter(a=>!a.x.paid).length,paid=du.length-unpaid;
    if(i===35&&ym(d)!==ui.calMonth)break;
    cells+=`<button class="d ${ym(d)!==ui.calMonth?'out':''} ${d===t?'today':''} ${d===ui.sel?'sel':''}" data-act="selDay" data-d="${d}" aria-label="${fmtDay(d)}"><span class="num">${+d.slice(8)}</span>
      <span class="dots">${ev?'<i></i>':''}${unpaid?'<i class="w"></i>':''}${paid&&!unpaid?'<i class="k"></i>':''}</span></button>`}
  const evs=eventsOn(ui.sel),du=duesOn(ui.sel);
  return `<div class="mnav"><h3>${monthName(ui.calMonth)}</h3><div class="navb"><button class="icon-btn" data-act="calMonth" data-n="-1" aria-label="Mês anterior">${I('left')}</button>
    <button class="icon-btn" data-act="calToday" aria-label="Hoje" style="width:auto;padding:0 12px;font-weight:700;font-size:14px">Hoje</button><button class="icon-btn" data-act="calMonth" data-n="1" aria-label="Próximo mês">${I('right')}</button></div></div>
    <div class="cal"><div class="wd">${DIA.map(d=>`<span>${d}</span>`).join('')}</div><div class="grid">${cells}</div></div>
    <div class="legend"><span><i class="o"></i>Compromisso</span><span><i style="background:var(--warn)"></i>Vencimento</span><span><i></i>Pago</span></div>
    <section><h2 class="sec">${relDay(ui.sel)==='hoje'?'Hoje':relDay(ui.sel)==='amanhã'?'Amanhã':fmtDay(ui.sel)} <button data-act="newEvent" data-d="${ui.sel}">+ Compromisso</button></h2>
    <div class="list">${evs.map(e=>evItem(e)).join('')}${du.map(a=>dueItem(a.d,a.x)).join('')}${!evs.length&&!du.length?'<div class="empty">Nada neste dia.</div>':''}</div></section>
    <button class="btn" data-act="exportAllIcs">${I('cal')} Enviar agenda para o Calendário do iPhone</button>
    <p class="small muted" style="margin:-8px 2px 0">Os alarmes do Calendário do iPhone tocam mesmo com o Pulso fechado.</p>`;
}

function vFin(){
  const m=ui.finMonth,p=ui.finProf,list=monthTx(m,p).sort((a,b)=>b.date.localeCompare(a.date)||0),s=sums(list);
  const months=[...Array(6)].map((_,i)=>addYM(m,i-5));const ms=months.map(x=>sums(monthTx(x,p)));const mx=Math.max(1,...ms.map(x=>Math.max(x.i,x.o)));
  const cat={};for(const x of list)if(x.type==='out')cat[x.cat]=(cat[x.cat]||0)+x.amount;
  const cats=Object.entries(cat).sort((a,b)=>b[1]-a[1]);const cmax=cats.length?cats[0][1]:1;
  const groups={};for(const x of list)(groups[x.date]=groups[x.date]||[]).push(x);
  return `<div class="mnav"><h3>${monthName(m)}</h3><div class="navb"><button class="icon-btn" data-act="finMonth" data-n="-1" aria-label="Mês anterior">${I('left')}</button><button class="icon-btn" data-act="finMonth" data-n="1" aria-label="Próximo mês">${I('right')}</button></div></div>
  <div class="chips"><button class="chip ${p==='all'?'on':''}" data-act="finProf" data-id="all">Tudo</button>${S.profiles.map(x=>`<button class="chip ${p===x.id?'on':''}" data-act="finProf" data-id="${x.id}">${x.type} · ${esc(x.name)}</button>`).join('')}</div>
  <div class="card"><div class="small muted">Saldo do mês</div><div class="big num ${s.b<0?'neg':''}">${money(s.b)}</div>
    <div style="display:flex;gap:18px;margin-top:8px" class="num small"><span class="muted">Entradas <b class="in">${money(s.i)}</b></span><span class="muted">Saídas <b style="color:var(--tx)">${money(s.o)}</b></span></div></div>
  <section><h2 class="sec">Últimos 6 meses</h2><div class="card"><div class="cols">${ms.map((x,i)=>`<div class="col ${months[i]===m?'cur':''}"><div class="pair"><i style="height:${x.i/mx*100}%"></i><i class="o" style="height:${x.o/mx*100}%"></i></div><span>${MES[+months[i].slice(5)-1].slice(0,3)}</span></div>`).join('')}</div>
    <div class="legend"><span><i></i>Entradas</span><span><i class="o"></i>Saídas</span></div></div></section>
  ${cats.length?`<section><h2 class="sec">Gastos por categoria</h2><div class="card cats">${cats.map(([c,v])=>`<div class="catrow"><div class="h"><b>${esc(c)}</b><span class="num muted">${money(v)} · ${Math.round(v/s.o*100)}%</span></div><div class="track"><i style="width:${v/cmax*100}%"></i></div></div>`).join('')}</div></section>`:''}
  <section><h2 class="sec">Lançamentos <button data-act="newTx" data-type="out">+ Lançar</button></h2>
  ${Object.keys(groups).length?Object.entries(groups).map(([d,xs])=>`<div class="grp">${relDay(d)}</div><div class="list">${xs.map(x=>`<button class="item" data-act="editTx" data-id="${x.id}"><div class="main"><div class="t">${esc(x.desc||x.cat)} ${docTag(x.profileId)}</div><div class="s">${esc(x.cat)}</div></div><div class="v num ${x.type==='in'?'in':''}">${x.type==='in'?'+':'−'} ${money(x.amount)}</div></button>`).join('')}</div>`).join(''):'<div class="list"><div class="empty">Nenhum lançamento neste mês.</div></div>'}</section>`;
}

function vDebts(){
  const p=ui.debtProf,ds=S.debts.filter(d=>p==='all'||d.profileId===p).map(d=>({d,f:debtInfo(d)}));
  const rank={red:0,warn:1,ok:2};ds.sort((a,b)=>(a.f.done-b.f.done)||(rank[a.f.status]-rank[b.f.status])||((a.f.next?.due||'9')>(b.f.next?.due||'9')?1:-1));
  let rem=0,month=0,late=0,lateV=0;for(const{d,f}of ds){if(f.done)continue;rem+=f.remaining;month+=d.value;late+=f.overdue.length;lateV+=f.overdue.length*d.value}
  const active=ds.filter(x=>!x.f.done),done=ds.filter(x=>x.f.done);
  const card=({d,f})=>`<button class="debt" data-act="openDebt" data-id="${d.id}"><div class="r1"><span class="t">${esc(d.name)}</span>${docTag(d.profileId)}<span class="pill ${f.status}">${f.label}</span></div>
    <div class="r2"><span>${f.n?`${f.paidCount}/${f.n} pagas`:'Mensal'}${d.creditor?' · '+esc(d.creditor):''}</span><span class="num"><b>${money(d.value)}</b>${f.next?' · '+relDay(f.next.due):''}</span></div>
    ${f.n?`<div class="prog ${f.done?'ok':''}"><i style="width:${f.paidCount/f.n*100}%"></i></div>`:''}</button>`;
  return `<div class="chips"><button class="chip ${p==='all'?'on':''}" data-act="debtProf" data-id="all">Todos</button>${S.profiles.map(x=>`<button class="chip ${p===x.id?'on':''}" data-act="debtProf" data-id="${x.id}">${x.type} · ${esc(x.name)}</button>`).join('')}<button class="chip" data-act="newProfile">+ CPF/CNPJ</button></div>
  <div class="card"><div class="small muted">Total em aberto${p!=='all'&&prof(p)?` · ${esc(prof(p).name)} ${hideDoc(prof(p).doc,prof(p).type)}`:''}</div><div class="big num">${money(rem)}</div>
  <div style="display:flex;gap:18px;margin-top:8px;flex-wrap:wrap" class="num small"><span class="muted">Por mês <b style="color:var(--tx)">${money(month)}</b></span>${late?`<span class="muted">Atrasado <b class="neg">${money(lateV)}</b></span>`:'<span class="muted">Nada atrasado <b class="in">✓</b></span>'}</div></div>
  <section><h2 class="sec">Ativas <button data-act="newDebt">+ Nova</button></h2><div class="list">${active.map(card).join('')||'<div class="empty">Nenhuma dívida ou conta cadastrada.</div>'}</div></section>
  ${done.length?`<section><h2 class="sec">Quitadas</h2><div class="list">${done.map(card).join('')}</div></section>`:''}`;
}

function debtForm(d){

/* ---------- quick add (linguagem natural) ---------- */
const W=(s,g='')=>new RegExp(`(?<!\\p{L})(?:${s})(?!\\p{L})`,'iu'+g);
function quickParse(raw){
  let s=raw.trim();const low=s.toLowerCase();
  const isOut=W('gastei|paguei|comprei|gasto|despesa').test(low),isIn=W('recebi|ganhei|receita|entrada|vendi').test(low);
  const mm=low.match(/(?:r\$\s*)?(\d{1,3}(?:\.\d{3})+(?:,\d{1,2})?|\d+(?:[.,]\d{1,2})?)(?!\s*(?:h|:|\/))/);
  if((isOut||isIn)&&mm){const type=isIn&&!isOut?'in':'out';
    let desc=(s.slice(0,mm.index)+' '+s.slice(mm.index+mm[0].length)).replace(W('gastei|paguei|comprei|gasto|despesa|recebi|ganhei|receita|entrada|vendi','g'),'').replace(/r\$/gi,'').replace(W('reais|real|com|de|no|na|em','g'),' ').replace(/\s+/g,' ').trim();
    desc=desc.replace(/^./,c=>c.toUpperCase());return {kind:'tx',type,amount:parseMoney(mm[1]),desc,cat:guessCat(raw,type)}}
  let date=today(),time='';const t=today();
  const take=re=>{const m=s.match(re);if(m){s=s.replace(m[0],' ');return m}return null};
  if(take(W('depois de amanh[ãa]')))date=addDays(t,2);else if(take(W('amanh[ãa]')))date=addDays(t,1);else if(take(W('hoje')))date=t;
  else{const wd=take(W('(?:n[oa]\\s+)?(?:pr[oó]xim[oa]\\s+)?(domingo|segunda|ter[çc]a|quarta|quinta|sexta|s[áa]bado)(?:-feira)?'));
    if(wd){const names=['domingo','segunda','terca','quarta','quinta','sexta','sabado'];const k=names.indexOf(wd[1].toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''));let diff=(k-new Date().getDay()+7)%7||7;date=addDays(t,diff)}
    else{const dm=take(/(?:dia\s+)?(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?/);if(dm){let y=dm[3]?+dm[3]:new Date().getFullYear();if(y<100)y+=2000;const c=`${y}-${pad(+dm[2])}-${pad(+dm[1])}`;date=(!dm[3]&&c<t)?`${y+1}${c.slice(4)}`:c}
      else{const d1=take(W('dia\\s+(\\d{1,2})'));if(d1){let c=`${ym(t)}-${pad(+d1[1])}`;if(c<t)c=addMonths(c,1);date=c}}}}
  const per=take(/(?<!\p{L})(?:[àa]s?\s+)?(\d{1,2})(?:[:h](\d{2}))?\s*h?\s+da\s+(manh[ãa]|tarde|noite)(?!\p{L})/iu);
  const tm=per||take(/(?:(?<!\p{L})[àa]s?\s+)?(\d{1,2})(?:[:h](\d{2}))?\s*(?:h(?:rs?|oras?)?)(?!\p{L})/iu)||take(/(?<!\p{L})[àa]s?\s+(\d{1,2})(?::(\d{2}))?/iu)||take(/(\d{1,2}):(\d{2})/);
  if(tm&&+tm[1]<24){let h=+tm[1];if(((per&&/tarde|noite/i.test(per[3]))||(!per&&W('[àa] noite|de noite|[àa] tarde').test(low)))&&h<12)h+=12;time=`${pad(h)}:${pad(+(tm[2]||0))}`}
  s=s.replace(W('[àa]s|dia|no|na|de manh[ãa]|de noite|[àa] tarde|[àa] noite','g'),' ').replace(/\s+/g,' ').trim();
  return {kind:'event',title:(s||raw).replace(/^./,c=>c.toUpperCase()),date,time};
}

/* ---------- .ics (Calendário do iPhone) ---------- */
const icsEsc=s=>String(s||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/([,;])/g,'\\$1');
const icsDT=(d,t)=>d.replace(/-/g,'')+'T'+t.replace(':','')+'00';
function vevent({id,title,date,time,dur=60,rrule,alarms=[],desc='',loc=''}){
  const stamp=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
  const L=['BEGIN:VEVENT',`UID:${id}@pulso`,`DTSTAMP:${stamp}`,`SUMMARY:${icsEsc(title)}`];
  if(time){const e=pd(date);const[h,m]=time.split(':');e.setHours(+h,+m+dur);L.push(`DTSTART:${icsDT(date,time)}`,`DTEND:${icsDT(ymd(e),pad(e.getHours())+':'+pad(e.getMinutes()))}`)}
  else L.push(`DTSTART;VALUE=DATE:${date.replace(/-/g,'')}`,`DTEND;VALUE=DATE:${addDays(date,1).replace(/-/g,'')}`);
  if(rrule)L.push('RRULE:'+rrule);if(loc)L.push('LOCATION:'+icsEsc(loc));if(desc)L.push('DESCRIPTION:'+icsEsc(desc));
  for(const a of alarms)L.push('BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:${icsEsc(title)}`,`TRIGGER:-PT${a}M`,'END:VALARM');
  L.push('END:VEVENT');return L.join('\r\n');
}
const wrapIcs=evs=>['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Pulso//PT-BR','CALSCALE:GREGORIAN','METHOD:PUBLISH',...evs,'END:VCALENDAR'].join('\r\n');
const RR={daily:'FREQ=DAILY',weekly:'FREQ=WEEKLY',monthly:'FREQ=MONTHLY',yearly:'FREQ=YEARLY'};
const evIcs=e=>vevent({id:e.id,title:e.title,date:e.date,time:e.time,rrule:RR[e.repeat],alarms:e.remind,desc:e.notes,loc:e.location});
function debtIcs(d){const f=debtInfo(d);const nx=f.overdue[0]||f.next;if(!nx)return null;const remaining=f.n?f.list.filter(x=>!x.paid&&x.due>=nx.due).length:0;
  return vevent({id:d.id,title:`💳 ${d.name} · ${BRL.format(d.value)}`,date:nx.due,time:S.settings.billTime,dur:15,rrule:f.n?`FREQ=MONTHLY;COUNT=${remaining}`:'FREQ=MONTHLY',alarms:d.remind,desc:`${d.creditor||''} ${prof(d.profileId)?.type||''} ${prof(d.profileId)?.name||''}`.trim()})}
async function deliver(name,text,mime){
  const file=new File([text],name,{type:mime});
  if(mime==='text/calendar'&&isIOS){const w=window.open('data:text/calendar;charset=utf-8,'+encodeURIComponent(text),'_blank');if(w)return}
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return}}catch(e){if(e.name==='AbortError')return}
  try{const url=URL.createObjectURL(file);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);toast('Arquivo gerado: '+name)}catch(e){toast('Este navegador não permite salvar arquivos aqui')}
}

async function sha(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('pulso:'+s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return 'p:'+btoa(s)}}
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b)));const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
function showLock(){if(!S.settings.pinHash)return;locked=true;pinBuf='';const L=$('#lock');L.hidden=false;drawLock();if(S.settings.faceCred)setTimeout(()=>A.faceUnlock(),250)}

  popOk(){popQ.shift();$('#popup').innerHTML='';haptic();showPopup()},
  popGo(){const x=popQ.shift();$('#popup').innerHTML='';if(x.go==='agenda'){ui.sel=x.day;ui.calMonth=ym(x.day)}A.tab({tab:x.go});if(x.debt)debtDetail(x.debt);showPopup()},
  snooze(){const x=popQ.shift();$('#popup').innerHTML='';S.snoozes.push({key:'s'+Date.now(),at:Date.now()+10*60000,alert:x.alert,title:x.title,body:x.body});save();toast('Aviso de novo em 10 minutos');showPopup()},
  remSettings(){const st=S.settings;sheet('Padrões de aviso',`
    <div class="f"><span>Tipo de aviso padrão</span>${seg('alert',ALERTS,st.alert,'red')}</div>
    <div class="f"><span>Compromissos: avisar antes</span>${checks('evRemind',EV_REM,st.evRemind)}</div>
    <div class="f"><span>Contas: avisar</span>${checks('debtRemind',DEBT_REM,st.debtRemind)}</div>
    <div class="row2"><label class="f"><span>Horário dos avisos de contas</span><input type="time" name="billTime" value="${st.billTime}"></label><label class="f"><span>Compromisso sem hora avisa às</span><input type="time" name="allDayTime" value="${st.allDayTime}"></label></div>
    <div class="f"><span>Ao marcar parcela paga</span>${seg('payToTx',[['1','Lançar em Finanças'],['0','Só marcar']],st.payToTx?'1':'0')}</div>
    <button class="btn primary" type="submit">Salvar</button>`,fd=>{Object.assign(st,{alert:fd.get('alert'),evRemind:fd.getAll('evRemind').map(Number),debtRemind:fd.getAll('debtRemind').map(Number),billTime:fd.get('billTime')||'09:00',allDayTime:fd.get('allDayTime')||'09:00',payToTx:fd.get('payToTx')==='1'});save();render();toast('Padrões salvos')})},
  pinSetup(){const has=!!S.settings.pinHash;sheet(has?'Senha do app':'Criar senha',`
    ${has?'<p class="muted" style="margin:0">Digite uma nova senha para trocar, ou desative o bloqueio.</p>':'<p class="muted" style="margin:0">O Pulso pede a senha ao abrir e depois de 1 minuto fora do app.</p>'}
    <div class="row2"><label class="f"><span>Senha (4 dígitos)</span><input name="p1" type="password" inputmode="numeric" maxlength="4" autocomplete="new-password"></label><label class="f"><span>Repita</span><input name="p2" type="password" inputmode="numeric" maxlength="4" autocomplete="new-password"></label></div>
    <div class="f err" id="ferr" hidden></div>
    <div class="btns"><button class="btn primary" type="submit">Salvar senha</button>${has?'<button class="btn danger" type="button" data-act="pinOff">Desativar bloqueio</button>':''}</div>`,
    async(fd,f)=>{const a=fd.get('p1'),b=fd.get('p2');const e=$('#ferr');if(!/^\d{4}$/.test(a)){e.hidden=false;e.textContent='Use exatamente 4 números.';return false}if(a!==b){e.hidden=false;e.textContent='As senhas não são iguais.';return false}
      S.settings.pinHash=await sha(a);save();closeSheet();render();toast('Senha criada')})},
  pinOff(){confirmBox('Desativar bloqueio?','O app abre sem senha e sem Face ID.','Desativar',()=>{S.settings.pinHash=null;S.settings.faceCred=null;save();closeSheet();render();toast('Bloqueio desativado')})},
  async faceSetup(){const st=S.settings;if(!st.pinHash){toast('Crie uma senha primeiro: ela é o plano B do Face ID');A.pinSetup();return}
    if(st.faceCred){confirmBox('Desativar Face ID?','Você entra só com a senha.','Desativar',()=>{st.faceCred=null;save();render()});return}
    try{if(!window.PublicKeyCredential)throw new Error('sem suporte');const c=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:'Pulso'},user:{id:crypto.getRandomValues(new Uint8Array(16)),name:'Pulso',displayName:'Pulso'},
      pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'preferred'},timeout:60000}});
      st.faceCred=b64(c.rawId);save();render();haptic();toast('Face ID ativado')}catch(e){toast(e.name==='NotAllowedError'?'Face ID cancelado':'Face ID não está disponível aqui. Abra pelo app instalado.')}},
  async faceUnlock(){try{const r=await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),allowCredentials:[{type:'public-key',id:unb64(S.settings.faceCred)}],userVerification:'required',timeout:60000}});if(r){haptic();unlock()}}catch(e){}},
  async pinKey(d){if(d.k==='del')pinBuf=pinBuf.slice(0,-1);else if(pinBuf.length<4)pinBuf+=d.k;haptic();drawLock();
    if(pinBuf.length===4){if(await sha(pinBuf)===S.settings.pinHash)unlock();else{pinBuf='';drawLock();$('#pdots').classList.add('shake')}}},
  exportData(){const st=new Date();deliver(`pulso-backup-${ymd(st)}.json`,JSON.stringify(S,null,1),'application/json')},
  importData(){$('#importFile').click()},
  wipe(){confirmBox('Apagar tudo?','Todos os compromissos, finanças, dívidas e documentos serão apagados deste aparelho. Faça um backup antes se quiser guardar.','Apagar tudo',()=>{const keep=S.settings;S=seed();S.events=[];S.tx=[];S.debts=[];S.settings={...keep,pinHash:keep.pinHash,faceCred:keep.faceCred};save();render();toast('Dados apagados')})},
  installHelp(){sheet('Instalar no iPhone',`<ol class="steps">
    <li>Abra este endereço no <b>Safari</b>.</li><li>Toque em <b>Compartilhar</b> (o quadrado com a seta para cima).</li>
    <li>Escolha <b>Adicionar à Tela de Início</b> e confirme com <b>Adicionar</b>.</li><li>Abra o <b>Pulso</b> pelo ícone novo e toque em <b>Ativar notificações</b>.</li></ol>
    <p class="small muted" style="margin:0">Instalado, o Pulso abre em tela cheia, funciona offline, mostra o número de pendências no ícone e libera notificações e Face ID.</p>
    <button class="btn primary" type="button" data-act="closeSheet">Entendi</button>`)},
  cfYes(){const f=confirmFn;confirmFn=null;$('#modal').innerHTML='';f&&f()},
  cfNo(){confirmFn=null;$('#modal').innerHTML=''}
};

document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const fn=A[el.dataset.act];if(fn){e.preventDefault();fn(el.dataset,el,e)}});
document.addEventListener('submit',e=>{if(e.target.id!=='qa')return;e.preventDefault();const v=$('#qaIn').value.trim();if(!v){$('#qaIn').focus();return}
  const r=quickParse(v);$('#qaIn').value='';if(r.kind==='tx')txForm(null,{type:r.type,amount:r.amount,desc:r.desc,cat:r.cat});else eventForm(null,{title:r.title,date:r.date,time:r.time})});
$('#importFile').addEventListener('change',e=>{const file=e.target.files[0];e.target.value='';if(!file)return;const rd=new FileReader();rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!d||!d.v||!Array.isArray(d.events))throw 0;
  confirmBox('Restaurar backup?',`Isso substitui os dados atuais por ${d.events.length} compromissos, ${d.tx.length} lançamentos e ${d.debts.length} dívidas.`,'Restaurar',()=>{S=d;S.lastCheck=Date.now();normalize();save();render();toast('Backup restaurado')})}catch(err){toast('Esse arquivo não é um backup do Pulso')}};rd.readAsText(file)});
addEventListener('scroll',()=>$('#top').classList.toggle('scrolled',scrollY>4),{passive:true});
document.addEventListener('visibilitychange',()=>{if(document.hidden){hiddenAt=Date.now()}else{if(S.settings.pinHash&&!locked&&hiddenAt&&Date.now()-hiddenAt>60000)showLock();check();render();showPopup()}});

/* ---------- boot ---------- */
load();save();render();
if(S.settings.pinHash)showLock();
check();setInterval(check,20000);
setInterval(()=>{if(!document.hidden&&!$('#layer').classList.contains('on')&&ui.tab==='home')render()},60000);
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator&&!inFrame&&location.protocol!=='file:'){navigator.serviceWorker.register('sw.js').catch(()=>{});
  navigator.serviceWorker.addEventListener('message',e=>{if(e.data&&e.data.go)A.tab({tab:e.data.go})})}
</script>
